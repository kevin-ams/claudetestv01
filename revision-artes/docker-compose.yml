# Base de datos local para desarrollo: `docker compose up -d`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: artes
      POSTGRES_PASSWORD: artes
      POSTGRES_DB: revision_artes
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data

volumes:
  datos:
